name: Android probe

# Throwaway probe: does the current `wordcraft-cli` dependency tree even compile for
# aarch64-linux-android with the NDK? No new code involved; deleted once it has answered.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_API: "24"
  TARGET: aarch64-linux-android

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          key: probe-android

      - name: Build
        run: cargo ndk --target arm64-v8a --platform "$ANDROID_API" build --release --locked -p wordcraft-cli 2>&1 | tail -100

      - name: Which crates failed, if any
        if: failure()
        run: echo "see the build log above"
